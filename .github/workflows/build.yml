name: Build and Release

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # The version declared in go.mod.
          go-version: '1.20.x'

      - name: Run Go tests
        run: go test ./...

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # The engine targets net10.0.
          dotnet-version: 10.0.x

      - name: Run engine tests
        run: |
          dotnet test coreconsole/Tests/Tests.csproj -p:RestoreSources=https://api.nuget.org/v3/index.json

      - name: Build Docker image
        run: |
          docker build -t myapp .

      - name: Create container and extract
        run: |
          mkdir -p ./app
          docker create --name extract myapp
          docker cp extract:/app/coreapi ./app/coreapi
          docker cp extract:/app/cc ./app/cc
          docker rm extract
      - name: Archive release
        run: tar -czvf output.tar.gz ./app

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: run-${{ github.run_number }}-${{ github.sha }}
          name: Build ${{ github.sha }}
          draft: false
          prerelease: false
          files: output.tar.gz
