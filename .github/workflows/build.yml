name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # The version declared in go.mod.
          go-version: '1.20.x'

      - name: Run Go tests
        run: go test ./...

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # The engine targets net10.0.
          dotnet-version: 10.0.x

      - name: Run engine tests
        run: |
          dotnet test coreconsole/Tests/Tests.csproj -p:RestoreSources=https://api.nuget.org/v3/index.json

      - name: Build Docker image
        run: |
          docker build -t coreapi .

      - name: Create container and extract
        run: |
          mkdir -p ./app
          docker create --name extract coreapi
          docker cp extract:/app/coreapi ./app/coreapi
          docker cp extract:/app/cc ./app/cc
          docker rm extract

      - name: Archive release
        if: startsWith(github.ref, 'refs/tags/')
        run: tar -czvf output.tar.gz ./app

      # A release is published when a tag is pushed; a plain push to main only
      # builds and tests.
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Build ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: output.tar.gz
